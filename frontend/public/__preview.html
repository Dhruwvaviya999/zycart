<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>preview bootstrap</title>
  </head>
  <body>
    <script>
      // Temporary QA helper: seeds theme + store state on this origin, then
      // forwards to the page under test. Deleted after visual verification.
      const params = new URLSearchParams(location.search);
      const theme = params.get('theme');
      if (theme) localStorage.setItem('theme', theme);

      if (params.get('seed') === 'cart') {
        localStorage.setItem(
          'zycart-cart',
          JSON.stringify({
            state: {
              lines: [
                { productId: 'p-001', quantity: 1, size: '8', color: 'sail' },
                { productId: 'p-009', quantity: 2, color: 'midnight' },
                { productId: 'p-017', quantity: 1, size: 'M', color: 'black' },
              ],
              savedForLater: [{ productId: 'p-034', quantity: 1, color: 'sage' }],
            },
            version: 0,
          }),
        );
        localStorage.setItem(
          'zycart-wishlist',
          JSON.stringify({ state: { ids: ['p-022', 'p-002', 'p-029', 'p-013'] }, version: 0 }),
        );
      }

      if (params.get('seed') === 'clear') {
        localStorage.removeItem('zycart-cart');
        localStorage.removeItem('zycart-wishlist');
      }

      location.replace(params.get('to') || '/');
    </script>
  </body>
</html>
