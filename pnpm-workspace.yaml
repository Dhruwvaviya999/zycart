packages:
  - frontend
  - backend

# bcrypt ships a native addon and pnpm blocks install scripts by default, which
# would leave it unbuilt — and failing at runtime — on any machine without a
# matching prebuilt binary. Approving it here keeps installs reproducible.
allowBuilds:
  '@google/genai': set this to true or false
  bcrypt: true
  esbuild: true
  protobufjs: set this to true or false
  unrs-resolver: true
